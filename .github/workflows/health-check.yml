name: Health Check

on:
  schedule:
    - cron: '*/30 * * * *'  # every 30 minutes
  workflow_dispatch:

jobs:
  ping:
    name: Ping Production
    runs-on: ubuntu-latest
    steps:
      - name: Check production health
        run: |
          max_attempts=5
          attempt=1
          delay=10
          max_delay=60
          health_url="${{ vars.APP_URL }}/api/health"
          
          while [ $attempt -le $max_attempts ]; do
            echo "Attempt $attempt of $max_attempts..."
            
            if response=$(curl -sfS --connect-timeout 10 --max-time 30 --retry 2 --retry-delay 5 --retry-all-errors "$health_url"); then
              echo "$response"
              if echo "$response" | jq -e '.success == true' > /dev/null; then
                echo "✅ Health check passed"
                exit 0
              fi
            fi
            
            if [ $attempt -lt $max_attempts ]; then
              echo "⚠️ Attempt $attempt failed, retrying in ${delay}s..."
              sleep $delay
              delay=$((delay * 2))
              if [ $delay -gt $max_delay ]; then
                delay=$max_delay
              fi
            fi
            
            attempt=$((attempt + 1))
          done
          
          echo "❌ Health check failed after $max_attempts attempts"
          exit 1
