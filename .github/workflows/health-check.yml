name: Health Check

on:
  schedule:
    - cron: '*/30 * * * *'  # every 30 minutes
  workflow_dispatch:

# One failed probe does not mean the app is down. GitHub-hosted runners are
# intermittently blackholed by the network in front of the VPS, which from a
# single runner is indistinguishable from an outage: every request times out
# for the whole run, then the next run from a different IP succeeds. Each stage
# below therefore runs on a fresh runner with a different egress IP, and only a
# failure seen from all three fails the workflow and sends a notification.
jobs:
  probe:
    name: Probe
    uses: ./.github/workflows/health-probe.yml
    with:
      app-url: ${{ vars.APP_URL }}

  recheck:
    name: Re-check
    needs: probe
    if: needs.probe.outputs.status == 'down'
    uses: ./.github/workflows/health-probe.yml
    with:
      app-url: ${{ vars.APP_URL }}
      delay-seconds: 60

  confirm:
    name: Confirm
    needs: recheck
    if: needs.recheck.outputs.status == 'down'
    uses: ./.github/workflows/health-probe.yml
    with:
      app-url: ${{ vars.APP_URL }}
      delay-seconds: 120

  alert:
    name: Production is down
    needs: [probe, recheck, confirm]
    if: needs.confirm.outputs.status == 'down'
    runs-on: ubuntu-latest
    steps:
      - name: Report outage
        run: |
          echo "::error::${{ vars.APP_URL }} failed three health probes from three runners."
          echo "Probe:   ${{ needs.probe.outputs.detail }}"
          echo "Re-check: ${{ needs.recheck.outputs.detail }}"
          echo "Confirm: ${{ needs.confirm.outputs.detail }}"
          exit 1
