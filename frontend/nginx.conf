# Redirect HTTP to HTTPS
server {
  listen 80;
  server_name micss-lab.be www.micss-lab.be;

  # Let Certbot handle ACME challenge over HTTP
  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

# HTTPS server
server {
  listen 443 ssl;
  server_name micss-lab.be www.micss-lab.be;

  ssl_certificate /etc/letsencrypt/live/micss-lab.be/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/micss-lab.be/privkey.pem;

  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers HIGH:!aNULL:!MD5;
  ssl_prefer_server_ciphers on;

  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://backend:3001/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    try_files $uri /index.html;
  }
}
