services:
  db:
    image: postgres:16-alpine
    container_name: modeling-tool-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-modeling_tool}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-modeling_tool}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: modeling-tool-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-modeling_tool}?schema=public
      PORT: 3001
      NODE_ENV: development
      CORS_ORIGIN: http://localhost:3000
      MAX_FILE_SIZE: 52428800
      LOG_LEVEL: debug
      JWT_SECRET: ${JWT_SECRET:-replace-this-with-a-strong-secret-of-at-least-32-characters}
      JWT_EXPIRES_IN: 7d
    ports:
      - "3002:3001"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: modeling-tool-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  db_data:
